name: Release

# Builds the Windows installer on GitHub's Windows runners and publishes a
# GitHub Release (exe + blockmap + latest.yml) so 0.16 booth PCs auto-update.
# Trigger: push a v* tag (e.g. v0.20.0). Do not create the Release by hand first
# — electron-builder owns latest.yml and the filenames the updater looks for.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - run: npm ci

      - run: npm run build

      - name: Publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always
