name: CI

on:
  push:
    branches: [feat/zone-decks, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned below 24.16.0 -- see 2026-08-19 root-cause note below.
          node-version: 24.15

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
