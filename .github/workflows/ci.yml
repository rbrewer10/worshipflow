name: CI

on:
  push:
    branches: [feat/zone-decks, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # This runner's npm (bundled with Node 26) warns "N packages have
      # install scripts not yet covered by allowScripts" and silently skips
      # them -- including electron's own postinstall, the step that
      # downloads the actual Electron binary. That's left node_modules/
      # electron without a binary since 2026-08-17, failing every test that
      # touches electron-store (db.test.ts, recovery.test.ts) with "Electron
      # failed to install correctly" even though npm ci itself reports
      # success. package.json's new top-level allowScripts covers the
      # flagged packages; `npm rebuild electron` re-runs its postinstall
      # explicitly as a fallback in case that alone isn't enough.
      - run: npm ci

      - run: npm rebuild electron

      - run: npm run typecheck

      - run: npm test
