name: CI

on:
  push:
    branches: [feat/zone-decks, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
        env:
          # electron/install.js's very first line is `if
          # (process.env.ELECTRON_SKIP_BINARY_DOWNLOAD) process.exit(0)` --
          # this runner has that set (probably a windows-latest image default
          # as of 2026-08-17), so electron's postinstall has been silently
          # doing nothing on every push since, leaving node_modules/electron
          # without a binary and failing every test that touches
          # electron-store (db.test.ts, recovery.test.ts) with "Electron
          # failed to install correctly" -- even though npm ci itself reports
          # success. Clearing it (empty string is falsy in JS) lets the real
          # postinstall run.
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''

      - run: npm run typecheck

      - run: npm test
