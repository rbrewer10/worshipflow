name: CI

on:
  push:
    branches: [feat/zone-decks, master]
  pull_request:

# A newer push to the same branch / PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint and the Vitest unit suite. Windows is the booth PCs'
  # platform (CRLF checkout, `\` paths); Ubuntu is the developer/QA box and
  # catches the opposite (POSIX paths, LF), which bit us twice (QA report-a §2,
  # B10-N2).
  test:
    name: typecheck · lint · unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned below 24.16.0: that version (and 26.1.0+) introduced a
          # stream destroy() change that breaks extract-zip/yauzl, silently
          # truncating electron's postinstall extraction (nodejs/node#63487).
          # See the "fix: CI - pin Node to 24.15" commit for full details.
          # Keep in sync with .nvmrc and package.json "engines".
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  # The real built app driven by Playwright (tests/e2e). WF_SIM=1 (set by
  # tests/e2e/electronApp.ts) gives one simulated output window, so no physical
  # displays are needed; each test gets a throwaway profile. Linux runs under
  # Xvfb with --no-sandbox (electronApp.ts adds it on Linux).
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Keep the tablet HTTP server off the default port on shared runners.
      WF_HTTP_PORT: 47393
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run build

      - name: Playwright e2e (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test

      - name: Playwright e2e (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
