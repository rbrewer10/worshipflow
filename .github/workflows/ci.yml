name: CI

on:
  push:
    branches: [feat/zone-decks, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # npm's install-scripts gate has been silently skipping electron's own
      # postinstall (the step that downloads the actual Electron binary) on
      # this runner since 2026-08-17, leaving node_modules/electron without a
      # binary and failing every test that touches electron-store (db.test.ts,
      # recovery.test.ts) with "Electron failed to install correctly" even
      # though npm ci itself reports success. Running its installer directly
      # bypasses whatever gated it during npm ci.
      - run: node node_modules/electron/install.js

      - run: npm run typecheck

      - run: npm test
