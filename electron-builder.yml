appId: com.snowhillchurch.worshipflow-pro
productName: WorshipFlow Pro
copyright: © 2026 Ryan Brewer

directories:
  output: dist-installer
  buildResources: build

# We have no native modules we actually use — sql.js is WebAssembly (arch-independent)
# and osc/ws/jszip are pure JS. Skipping the rebuild avoids electron-builder trying to
# compile the unused optional serialport native binding (which has no build toolchain here).
npmRebuild: false

asar: true
# sql.js reads sql-wasm.wasm from disk at runtime via require.resolve; it must be a real
# file, not packed inside app.asar, or the database can't open.
asarUnpack:
  - '**/node_modules/sql.js/dist/sql-wasm.wasm'
  - '**/node_modules/ffmpeg-static/**'

# Everything under out/ (the electron-vite build) plus production node_modules is included
# by default; these exclusions keep source, tooling, and the unused serialport binding out.
#
# This list is exclusion-only (no positive allowlist), so it silently falls behind whenever
# a new top-level file/folder shows up in the project — that's exactly how v0.14.2 shipped a
# 412MB installer containing tests/, test-results/ (Playwright artifacts), every config file,
# and even a stray installer .exe that happened to be sitting in the project root. Re-check
# this list against `ls` at the project root whenever the built installer's size looks off.
files:
  - '!.claude/**'
  - '!.full-review/**'
  - '!.superpowers/**'
  - '!.worktrees/**'
  - '!.worshipflow-dev/**'
  - '!.github/**'
  - '!src/**'
  - '!scripts/**'
  - '!docs/**'
  - '!tests/**'
  - '!test-results/**'
  - '!playwright-report/**'
  - '!build/**'
  - '!electron.vite.config.*'
  - '!tsconfig*.json'
  - '!**/*.tsbuildinfo'
  - '!*.md'
  - '!*.exe'
  - '!launch-worshipflow.vbs'
  - '!gen-bg.html'
  - '!test-import.js'
  - '!playwright.config.ts'
  - '!postcss.config.js'
  - '!tailwind.config.js'
  - '!vitest.config.ts'
  - '!eslint.config.mjs'
  - '!package-lock.json'
  - '!**/node_modules/@serialport/**'
  - '!**/node_modules/serialport/**'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: WorshipFlow Pro
  uninstallDisplayName: WorshipFlow Pro
  # The default artifact name ("${productName} Setup ${version}.${ext}")
  # contains spaces, because productName ("WorshipFlow Pro") does. That
  # broke auto-update in practice: electron-builder's own latest.yml writer
  # replaces spaces with HYPHENS when recording the expected filename, the
  # actual built .exe keeps the literal spaces, and GitHub's manual-upload
  # UI replaces spaces with DOTS — three different names for the same file,
  # so electron-updater 404'd trying to download it. A space-free
  # artifactName makes all three converge on one name.
  artifactName: WorshipFlow-Pro-Setup-${version}.${ext}

# Where `npm run dist` looks to check "is there a newer release" at runtime
# (electron-updater reads this, packaged into the app as app-update.yml) and
# where electron-builder generates latest.yml at build time. The repo is
# public — created 2026-08-02 specifically so update checks need no auth
# token embedded in the shipped app. See the 2026-08-02 auto-update design
# spec for why.
publish:
  provider: github
  owner: rbrewer10
  repo: worshipflow
