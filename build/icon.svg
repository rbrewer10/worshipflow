<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WorshipFlow Pro">
  <defs>
    <linearGradient id="tile" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cross" x1="256" y1="150" x2="256" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eafff5"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#tile)"/>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#glow)"/>

  <!-- Flow: a stream of light passing behind the cross -->
  <path d="M64 356 C 128 316, 176 316, 232 344 S 356 388, 448 340"
        stroke="#d1fae5" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M64 396 C 136 364, 188 372, 248 392 S 372 420, 448 384"
        stroke="#ffffff" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Cross (soft-rounded bars, sitting in front of the flow) -->
  <g fill="url(#cross)">
    <rect x="222" y="150" width="68" height="256" rx="26"/>
    <rect x="164" y="232" width="184" height="68" rx="26"/>
  </g>
</svg>
