<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WorshipFlow Pro">
  <defs>
    <linearGradient id="tile" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173a6b"/>
      <stop offset="0.55" stop-color="#0f2b52"/>
      <stop offset="1" stop-color="#0a1e3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cross" x1="256" y1="150" x2="256" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="infinity" x1="150" y1="366" x2="362" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93c0f5"/>
      <stop offset="0.5" stop-color="#5a97e8"/>
      <stop offset="1" stop-color="#3f83e0"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#tile)"/>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#glow)"/>

  <!-- Cross (soft-rounded bars) -->
  <g fill="url(#cross)">
    <rect x="222" y="150" width="68" height="256" rx="26"/>
    <rect x="164" y="232" width="184" height="68" rx="26"/>
  </g>

  <!-- Infinity in front of the cross, wrapping its base (matches the wordmark logo) -->
  <path d="M256 372 C 224 328, 168 328, 150 372 C 132 416, 224 416, 256 372 C 288 328, 380 328, 362 372 C 344 416, 288 416, 256 372 Z"
        stroke="url(#infinity)" stroke-width="32" stroke-linejoin="round" fill="none"/>
</svg>
